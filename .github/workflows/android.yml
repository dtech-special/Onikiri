name: Android CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "codenames.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get version from codenames.txt
        id: version
        run: |
          line=$(grep -v '^[[:space:]]*$' codenames.txt | tail -n 1)
          codename=$(echo "$line" | sed -E 's/^([^ (]+).*/\1/')
          version=$(echo "$line" | sed -E 's/.*\(([0-9A-Za-z._-]+)\).*/\1/')

          if [ -z "$codename" ] || [ -z "$version" ]; then
            echo "Ошибка парсинга codenames.txt: '$line'"
            exit 1
          fi

          echo "codename=$codename" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          apk_path=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          target="app/build/outputs/apk/debug/Onikiri-${{ steps.version.outputs.version }}-${{ steps.version.outputs.codename }}.apk"
          if [ "$apk_path" != "$target" ]; then
            mv "$apk_path" "$target"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Onikiri-${{ steps.version.outputs.version }}-${{ steps.version.outputs.codename }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Onikiri ${{ steps.version.outputs.version }} — ${{ steps.version.outputs.codename }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
